<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>械维工质官网</title>
<meta name="description" content="械维工质官网 —— 工业机械研究与检定档案，发布机构公告与研究报告。">
<meta name="keywords" content="械维工质,械维工质官网,工业机械,机械研究,检定,研究报告">
<meta property="og:title" content="械维工质官网">
<meta property="og:description" content="工业机械研究与检定档案 · 公告与研究报告">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2315110d'/%3E%3Crect x='6' y='6' width='52' height='52' fill='none' stroke='%23d8d6cf' stroke-width='3'/%3E%3Crect x='18' y='18' width='28' height='28' fill='%23c8102e'/%3E%3C/svg%3E">
<link rel="canonical" href="https://tafuya9csy.github.io/">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Organization","name":"械维工质","alternateName":"Gongzhi Industrial Instruments Bureau","url":"https://tafuya9csy.github.io/","description":"工业机械研究与检定档案，发布机构公告与研究报告。"}
</script>
<!-- ===== 安全策略 ===== -->
<!-- 内容安全策略：只允许同源资源，阻止一切外部脚本/iframe/注入 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';">
<!-- 禁止 MIME 类型嗅探 -->
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<!-- 禁止被嵌入 iframe（防点击劫持） -->
<meta http-equiv="X-Frame-Options" content="DENY">
<!-- Referrer 策略：仅在同源时发送完整路径 -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- 禁止搜索引擎索引可疑参数页面 -->
<meta name="robots" content="index, follow, nositelinkssearchbox">
<style>
  :root{
    --ink:#15110d; --paper:#f4f1ea; --paper2:#ece7db; --paper3:#e3ddcd;
    --red:#c8102e; --red-d:#9c0c23; --steel:#1c3d5a; --platinum:#d8d6cf;
    --dim:#5a5147; --dim2:#8a8071;
    --fs:"Arial Narrow","Helvetica Neue Condensed","PingFang SC","Microsoft YaHei",sans-serif;
    --fm:"Courier New",ui-monospace,monospace;
    --fb:"Arial Black","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:var(--fs); color:var(--ink); background:var(--paper);
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--steel); text-decoration:none}
  /* ===== Header ===== */
  .topbar{ background:var(--ink); color:var(--paper); border-bottom:7px solid var(--red); }
  .topbar-in{ max-width:1100px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; flex-direction:column; line-height:.95; }
  .brand .cn{ font-family:var(--fb); font-weight:900; font-size:clamp(22px,4vw,30px); letter-spacing:.1em; }
  .brand .en{ font-family:var(--fm); font-size:10px; letter-spacing:.26em; color:var(--platinum); margin-top:5px; }
  .nav{ display:flex; gap:18px; font-family:var(--fm); font-size:12px; letter-spacing:.18em; color:#bdb4a4; }
  .nav span{ cursor:default; }
  .nav .on{ color:var(--red); }
  .subbar{ background:var(--steel); color:var(--paper); font-family:var(--fm); font-size:11px; letter-spacing:.2em; border-bottom:2px solid var(--ink); }
  .subbar-in{ max-width:1100px; margin:0 auto; padding:7px 20px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  /* ===== Main ===== */
  .wrap{ max-width:1100px; margin:0 auto; padding:26px 20px 40px; }
  .sec-title{ display:flex; align-items:baseline; gap:12px; margin:0 0 14px; }
  .sec-title .bar{ width:7px; height:20px; background:var(--red); display:inline-block; flex:0 0 auto; }
  .sec-title .bar.b{ background:var(--steel); }
  .sec-title .t{ font-family:var(--fb); font-weight:900; font-size:21px; letter-spacing:.08em; }
  .sec-title .e{ font-family:var(--fm); font-size:11px; letter-spacing:.24em; color:var(--dim); }
  .sec-title .refresh{ margin-left:auto; font-family:var(--fm); font-size:11px; letter-spacing:.12em; color:var(--dim); background:var(--paper2); border:2px solid var(--ink); padding:5px 11px; cursor:pointer; }
  .sec-title .refresh:hover{ background:var(--ink); color:var(--paper); }
  .sec{ margin-bottom:34px; }
  /* announcement */
  .announce{ display:flex; border:3px solid var(--ink); background:var(--paper2); }
  .announce .tag{ background:var(--red); color:var(--paper); writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--fb); font-weight:900; font-size:16px; letter-spacing:.3em; padding:14px 7px; display:flex; align-items:center; flex:0 0 auto; }
  .announce .ct{ padding:15px 17px; flex:1; min-width:0; }
  .announce h4{ font-family:var(--fb); font-weight:900; font-size:17px; letter-spacing:.02em; line-height:1.3; }
  .announce .meta{ font-family:var(--fm); font-size:11px; color:var(--dim); letter-spacing:.1em; margin:6px 0 9px; }
  .announce p{ font-size:14px; line-height:1.65; color:#2b2419; white-space:pre-wrap; word-break:break-word; }
  .empty{ border:3px dashed var(--ink); background:var(--paper2); padding:22px; text-align:center; font-family:var(--fm); font-size:13px; letter-spacing:.12em; color:var(--dim); }
  /* reports */
  .reps{ display:flex; flex-direction:column; gap:11px; }
  .rep{ display:flex; gap:13px; border:3px solid var(--ink); background:var(--paper); padding:12px 14px; cursor:pointer; transition:transform .08s ease, background .12s; }
  .rep:hover{ background:var(--paper2); }
  .rep:active{ transform:translateY(1px); }
  .rep .no{ font-family:var(--fm); font-weight:900; font-size:16px; color:var(--red); border-right:2px solid var(--ink); padding-right:13px; display:flex; align-items:center; min-width:58px; justify-content:center; flex:0 0 auto; }
  .rep .rc{ flex:1; min-width:0; }
  .rep h5{ font-family:var(--fb); font-weight:900; font-size:15.5px; letter-spacing:.01em; line-height:1.3; }
  .rep .d{ font-family:var(--fm); font-size:11px; color:var(--dim); letter-spacing:.12em; margin:3px 0 4px; }
  .rep p{ font-size:12.5px; line-height:1.5; color:#3a3329; }
  .rep .arr{ font-family:var(--fm); font-weight:900; font-size:16px; color:var(--ink); align-self:center; flex:0 0 auto; }
  /* skeleton */
  .sk{ border:3px solid var(--ink); background:var(--paper2); padding:14px; }
  .sk .ln{ height:12px; background:var(--paper3); margin-bottom:8px; }
  .sk .ln.s{ width:55%; }
  .sk .ln.l{ width:90%; }
  /* modal */
  .overlay{ position:fixed; inset:0; background:rgba(21,17,13,.72); display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; }
  .overlay.show{ display:flex; }
  .modal{ background:var(--paper); border:4px solid var(--ink); max-width:760px; width:100%; max-height:90vh; overflow:auto; }
  .modal-h{ background:var(--ink); color:var(--paper); padding:14px 16px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; border-bottom:4px solid var(--red); }
  .modal-h .mt{ font-family:var(--fb); font-weight:900; font-size:17px; letter-spacing:.02em; line-height:1.3; }
  .modal-h .mm{ font-family:var(--fm); font-size:11px; color:var(--platinum); letter-spacing:.12em; margin-top:4px; }
  .modal-h .x{ background:var(--red); color:var(--paper); border:none; font-family:var(--fb); font-weight:900; font-size:18px; width:34px; height:34px; cursor:pointer; flex:0 0 auto; line-height:1; }
  .modal-b{ padding:18px 18px 22px; }
  .modal-b .body{ font-size:14.5px; line-height:1.75; white-space:pre-wrap; word-break:break-word; color:#241f17; }
  .modal-b .load{ font-family:var(--fm); font-size:12px; letter-spacing:.12em; color:var(--dim); }
  /* footer */
  .foot{ background:var(--ink); color:#9a9081; font-family:var(--fm); font-size:11px; letter-spacing:.14em; border-top:7px solid var(--red); }
  .foot-in{ max-width:1100px; margin:0 auto; padding:14px 20px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .foot b{ color:var(--red); }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--fm); font-size:12px; letter-spacing:.1em; padding:10px 18px; border:2px solid var(--red); z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show{ opacity:1; }
  @media (max-width:640px){
    .nav{ font-size:11px; gap:12px; }
    .announce .tag{ font-size:14px; padding:10px 6px; }
    .rep .no{ min-width:46px; font-size:14px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="cn">械维工质</span>
      <span class="en">GONGZHI · INDUSTRIAL INSTRUMENTS BUREAU</span>
    </div>
    <nav class="nav">
      <span class="on">首页</span>
      <span>公告</span>
      <span>研究报告</span>
      <span>关于</span>
    </nav>
  </div>
  <div class="subbar"><div class="subbar-in">
    <span>EST. 2026 · FILE NO.0001</span>
    <span>RAWMATTER · 重工档案</span>
  </div></div>
</header>

<main class="wrap">

  <h1 style="position:absolute;left:-9999px;">械维工质官网</h1>

  <section class="sec" id="sec-announce">
    <div class="sec-title">
      <span class="bar"></span>
      <span class="t">公告</span>
      <span class="e">NOTICE / 置顶</span>
      <button class="refresh" id="refresh-btn">刷新 ↻</button>
    </div>
    <div id="announce-area"><div class="sk"><div class="ln l"></div><div class="ln s"></div><div class="ln l"></div></div></div>
  </section>

  <section class="sec" id="sec-reports">
    <div class="sec-title">
      <span class="bar b"></span>
      <span class="t">研究报告</span>
      <span class="e">RESEARCH REPORTS</span>
    </div>
    <div id="reports-area"><div class="sk"><div class="ln l"></div><div class="ln s"></div></div></div>
  </section>

</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-h">
      <div>
        <div class="mt" id="m-title">—</div>
        <div class="mm" id="m-meta">—</div>
      </div>
      <button class="x" id="m-close">×</button>
    </div>
    <div class="modal-b"><div class="body" id="m-body"><span class="load">载入中…</span></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer class="foot"><div class="foot-in">
  <span>© 2026 械维工质</span>
  <b>GONGZHI BUREAU</b>
  <span>RAW · STEEL · INK</span>
</div></footer>

<script>
(function(){
  "use strict";
  var BASE="data/";
  function bust(){ return "?v=" + Date.now(); }
  function esc(s){ s=(s==null?"":String(s)); return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function id3(id){ var s=(id!=null?String(id):"—"); return (s.length<3 && /^\d+$/.test(s)) ? s.padStart(3,"0") : s; }

  var toastTimer=null;
  function toast(msg){
    var t=document.getElementById("toast");
    t.textContent=msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){t.classList.remove("show");},2200);
  }

  function fetchJSON(url){
    return fetch(url,{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    });
  }
  function fetchText(url){
    return fetch(url,{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.text();
    });
  }

  // ---- Announcement ----
  function loadAnnouncement(){
    var area=document.getElementById("announce-area");
    area.innerHTML='<div class="sk"><div class="ln l"></div><div class="ln s"></div><div class="ln l"></div></div>';
    fetchJSON(BASE+"announcements.json"+bust()).then(function(a){
      if(!a || (!a.title && !a.body)){
        area.innerHTML='<div class="empty">暂无公告</div>';
        return;
      }
      area.innerHTML=
        '<div class="announce">'+
          '<div class="tag">公告</div>'+
          '<div class="ct">'+
            '<h4>'+esc(a.title||"无标题")+'</h4>'+
            '<div class="meta">'+esc(a.date||"—")+' · '+esc(a.number||"—")+'</div>'+
            '<p>'+esc(a.body||"")+'</p>'+
          '</div>'+
        '</div>';
    }).catch(function(){
      area.innerHTML='<div class="empty">公告读取失败，请稍后刷新</div>';
    });
  }

  // ---- Reports ----
  var indexCache=null;
  function loadReports(){
    var area=document.getElementById("reports-area");
    area.innerHTML='<div class="sk"><div class="ln l"></div><div class="ln s"></div></div>';
    indexCache=null;
    fetchJSON(BASE+"reports-index.json"+bust()).then(function(list){
      indexCache=list||[];
      if(!list || !list.length){
        area.innerHTML='<div class="empty">暂无研究报告</div>';
        return;
      }
      var html='<div class="reps">';
      for(var i=0;i<list.length;i++){
        var r=list[i];
        html+=
          '<div class="rep" data-file="'+esc(r.file||"")+'">'+
            '<div class="no">№ '+esc(id3(r.id))+'</div>'+
            '<div class="rc">'+
              '<h5>'+esc(r.title||"无标题")+'</h5>'+
              '<div class="d">'+esc(r.date||"—")+' · '+esc(r.category||"—")+'</div>'+
            '</div>'+
            '<div class="arr">›</div>'+
          '</div>';
      }
      html+='</div>';
      area.innerHTML=html;
      var rows=area.querySelectorAll(".rep");
      for(var k=0;k<rows.length;k++){
        (function(row){ row.addEventListener("click",function(){ openReport(row.getAttribute("data-file")); }); })(rows[k]);
      }
    }).catch(function(){
      area.innerHTML='<div class="empty">研究报告读取失败，请稍后刷新</div>';
    });
  }

  // ---- Report modal ----
  function openReport(file){
    if(!file){ toast("报告文件缺失"); return; }
    var ov=document.getElementById("overlay");
    document.getElementById("m-title").textContent="载入中…";
    document.getElementById("m-meta").textContent="";
    document.getElementById("m-body").innerHTML='<span class="load">载入中…</span>';
    ov.classList.add("show");
    // find meta from cached index
    var r=null;
    if(indexCache){ for(var i=0;i<indexCache.length;i++){ if(indexCache[i].file===file){ r=indexCache[i]; break; } } }
    fetchText(BASE+file+bust()).then(function(text){
      var title = r ? r.title : ((text||"").split(/\r?\n/)[0]||"研究报告");
      var meta = r ? ((r.date||"—")+" · "+(r.category||"—")+" · № "+id3(r.id)) : "全文档案";
      document.getElementById("m-title").textContent=title;
      document.getElementById("m-meta").textContent=meta;
      document.getElementById("m-body").textContent=text;
    }).catch(function(){
      document.getElementById("m-title").textContent="读取失败";
      document.getElementById("m-body").innerHTML='<span class="load">报告正文读取失败，请稍后重试</span>';
    });
  }

  // events
  document.getElementById("refresh-btn").addEventListener("click",function(){
    loadAnnouncement(); loadReports(); toast("已刷新");
  });
  document.getElementById("m-close").addEventListener("click",function(){
    document.getElementById("overlay").classList.remove("show");
  });
  document.getElementById("overlay").addEventListener("click",function(e){
    if(e.target===this){ this.classList.remove("show"); }
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ document.getElementById("overlay").classList.remove("show"); }
  });

  // init
  loadAnnouncement();
  loadReports();
})();
</script>
</body>
</html>
